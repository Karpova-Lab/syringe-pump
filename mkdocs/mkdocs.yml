site_name: Syringe Pump Documentation
site_description: Open-source syringe pump
site_author: Andy Lustig
repo_url: https://github.com/Karpova-Lab/syringe-pump/tree/v3
repo_name: Karpova-Lab/syringe-pump
copyright: Copyright &copy; 2025 Andy Lustig

extra:
    discussion_url: https://github.com/Karpova-Lab/syringe-pump/discussions
    issues_url: https://github.com/Karpova-Lab/syringe-pump/issues
    version:
        provider: mike

nav:
    - Overview: index.md
    - Pump: pump.md
    - Controller: controller.md
    - Software: software.md

docs_dir: src
# site_dir: ../docs #uncomment this line to build the site in the parent directory

theme:
    name: material
    custom_dir: overrides
    logo: custom/home.svg
    palette:
        primary: teal
        accent: teal
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.footer
        - navigation.instant
        - content.code.copy
        - content.code.annotate

extra_css:
    - custom/extra.css

plugins:
    - search
    - include-markdown:
          comments: false

markdown_extensions:
    - toc:
          title: On this page
          permalink: "#"
          toc_depth: 3
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.highlight
    - pymdownx.blocks.caption
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.tilde
    - pymdownx.details
    - footnotes
    - pymdownx.snippets:
          base_path: src
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
